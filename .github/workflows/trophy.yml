name: Generate trophy card

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout trophy generator
        uses: actions/checkout@v4
        with:
          repository: Erik-Donath/github-profile-trophy
          ref: feature/generate-svg
          path: trophy-src
          persist-credentials: false

      - name: setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: generate trophy.svg
        env:
          GITHUB_TOKEN1: ${{ secrets.GH_PAT }}
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write \
            trophy-src/render_svg.ts \
            "${{ github.repository_owner }}" \
            --file dist/trophy.svg \
            --theme dracula \
            --rows 1 \
            --margin-width 8 \
            --margin-height 8

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
